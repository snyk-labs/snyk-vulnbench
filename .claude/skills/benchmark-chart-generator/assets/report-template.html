<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__REPORT_TITLE__</title>
  <style>
    :root {
      /* Snyk Evo glow palette — source tokens */
      --snyk-purple: #9043c6;
      --snyk-glow-light-blue: #00bcffb3;
      --snyk-glow-pink: #ff0ff3b3;
      --snyk-glow-orange: #ff890499;
      --snyk-glow-pink-soft: #ff0ff399;
      --snyk-glow-red: #fb2c3680;
      --snyk-glow-orange-soft: #ff890480;

      /* Layout */
      --bg: #ffffff;
      --text: #111111;
      --muted: #5c5c5c;
      --grid: #e8e8e8;
      --axis: #000000;
      --radius: 6px;
      --font: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

      /* Chart role colors — change these to retheme.
         "model" = the AI agent (e.g. Claude Sonnet).
         "snyk"  = Snyk Code SAST. */
      --bar-model: #4a4a4a;
      --bar-snyk: var(--snyk-purple);

      /* Recall/precision pairs — model gets neutral grays, Snyk gets brand tones */
      --bar-model-recall: #4a4a4a;
      --bar-model-precision: #a0a0a0;
      --bar-snyk-recall: var(--snyk-purple);
      --bar-snyk-precision: #c39bdf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 48px 32px 64px;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .page {
      max-width: 880px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 40px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0;
    }

    .meta {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .task-group {
      margin-bottom: 64px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--grid);
    }

    .headline-group {
      margin-bottom: 72px;
      padding-bottom: 40px;
      border-bottom: 2px solid var(--axis);
    }

    .task-group:last-child {
      border-bottom: none;
    }

    .task-group h2.task-title,
    .headline-group h2.task-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }

    .task-group .task-subtitle,
    .headline-group .task-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 24px;
    }

    section.chart-section {
      margin-bottom: 48px;
    }

    section.chart-section h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }

    section.chart-section .chart-desc {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0 0 16px;
    }

    .chart-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .chart-wrap svg {
      display: block;
      min-width: 520px;
    }

    .y-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      fill: var(--muted);
    }

    .grid line {
      stroke: var(--grid);
      stroke-width: 1;
    }

    .axis-x {
      stroke: var(--axis);
      stroke-width: 1.5;
    }

    .tick-label {
      font-size: 12px;
      fill: var(--text);
    }

    .value-label {
      font-size: 13px;
      font-weight: 700;
      fill: var(--text);
    }

    .error-bar {
      stroke: var(--axis);
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    .footnote {
      font-size: 0.75rem;
      font-style: italic;
      fill: var(--muted);
    }

    footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--grid);
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>__REPORT_TITLE__</h1>
      <p class="subtitle">__REPORT_SUBTITLE__</p>
      <p class="meta" id="report-meta"></p>
    </header>

    <div id="charts-root"></div>

    <footer>
      Static report generated from embedded benchmark JSONL rows. See <code>public/README.md</code> for how to refresh the data.
    </footer>
  </div>

  <script>
    const BENCHMARK_ROWS = __BENCHMARK_ROWS__;

    const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const COLORS = {
      model: css("--bar-model") || "#4a4a4a",
      snyk: css("--bar-snyk") || "#9043c6",
      modelRecall: css("--bar-model-recall") || "#4a4a4a",
      modelPrecision: css("--bar-model-precision") || "#a0a0a0",
      snykRecall: css("--bar-snyk-recall") || "#9043c6",
      snykPrecision: css("--bar-snyk-precision") || "#c39bdf",
    };

    function ns(tag, attrs, children) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      if (attrs) {
        for (const [k, v] of Object.entries(attrs)) {
          if (v !== undefined && v !== null) el.setAttribute(k, String(v));
        }
      }
      if (children) {
        for (const c of children) {
          if (typeof c === "string") el.appendChild(document.createTextNode(c));
          else if (c) el.appendChild(c);
        }
      }
      return el;
    }

    function topRoundedRect(x, y, w, h, r) {
      if (h <= 0) return `M${x},${y + h}h${w}v0h${-w}z`;
      const clampR = Math.min(r, w / 2, h);
      return [
        `M${x},${y + h}`,
        `V${y + clampR}`,
        `Q${x},${y} ${x + clampR},${y}`,
        `H${x + w - clampR}`,
        `Q${x + w},${y} ${x + w},${y + clampR}`,
        `V${y + h}`,
        `Z`,
      ].join("");
    }

    function isFiniteNumber(x) {
      return typeof x === "number" && Number.isFinite(x);
    }

    function pct(x) {
      if (!isFiniteNumber(x)) return "N/A";
      return (100 * x).toFixed(1) + "%";
    }

    function pctWithStdDev(value, stdDev, repetitions) {
      if (!isFiniteNumber(value)) return "N/A";
      if (!isFiniteNumber(stdDev) || repetitions <= 1) return pct(value);
      return `${(100 * value).toFixed(1)}% ± ${(100 * stdDev).toFixed(1)}pp`;
    }

    function fmtMs(ms) {
      if (!isFiniteNumber(ms)) return "N/A";
      if (ms >= 1000) return (ms / 1000).toFixed(1) + " s";
      return ms + " ms";
    }

    function fmtTokens(tokens) {
      if (!isFiniteNumber(tokens)) return "N/A";
      if (tokens >= 1000000) return (tokens / 1000000).toFixed(2) + "M";
      if (tokens >= 1000) return (tokens / 1000).toFixed(1) + "K";
      return String(Math.round(tokens));
    }

    function fmtCost(cost) {
      if (!isFiniteNumber(cost)) return "N/A";
      return "$" + cost.toFixed(cost >= 1 ? 2 : 3);
    }

    function niceMax(values, step) {
      const max = Math.max(...values.filter(isFiniteNumber), 0);
      if (max <= 0) return step;
      return Math.ceil(max / step) * step;
    }

    function yTicks(max) {
      return [0, 0.2, 0.4, 0.6, 0.8, 1].map((t) => t * max);
    }

    function renderBarChart(container, options) {
      const {
        title,
        yAxisLabel,
        categories,
        values,
        valueFormat,
        yMax,
        yTicks,
        yTickFormat,
        barColors,
        errorValues = [],
      } = options;

      const W = 720;
      const H = 260;
      const margin = { top: 28, right: 24, bottom: 52, left: 64 };
      const innerW = W - margin.left - margin.right;
      const innerH = H - margin.top - margin.bottom;
      const n = categories.length;
      const gap = innerW * 0.12 / Math.max(n - 1, 1);
      const barW = (innerW - gap * (n - 1)) / n;

      const svg = ns("svg", {
        viewBox: `0 0 ${W} ${H}`,
        width: "100%",
        height: H,
        role: "img",
        "aria-label": title,
      });

      const gRoot = ns("g", { transform: `translate(${margin.left},${margin.top})` });
      svg.appendChild(gRoot);

      const fmtY = yTickFormat || ((t) => String(t));
      for (const t of yTicks) {
        const y = innerH - (t / yMax) * innerH;
        gRoot.appendChild(ns("line", { class: "grid", x1: 0, x2: innerW, y1: y, y2: y }));
        gRoot.appendChild(
          ns(
            "text",
            {
              class: "tick-label",
              x: -10,
              y: y + 4,
              "text-anchor": "end",
              "font-size": "11",
              fill: "#5c5c5c",
            },
            [fmtY(t)]
          )
        );
      }

      gRoot.appendChild(ns("line", { class: "axis-x", x1: 0, x2: innerW, y1: innerH, y2: innerH }));

      const yLabel = ns("text", {
        class: "y-label",
        x: -innerH / 2,
        y: -50,
        transform: "rotate(-90)",
        "text-anchor": "middle",
      }, [yAxisLabel]);
      gRoot.appendChild(yLabel);

      categories.forEach((label, i) => {
        const rawValue = values[i];
        const v = isFiniteNumber(rawValue) ? rawValue : 0;
        const h = (v / yMax) * innerH;
        const x = i * (barW + gap);
        const y = innerH - h;
        const fill = barColors[i] || COLORS.model;
        const err = isFiniteNumber(errorValues[i]) ? Math.max(0, errorValues[i]) : 0;
        const upper = Math.min(yMax, v + err);
        const lower = Math.max(0, v - err);
        const yUpper = innerH - (upper / yMax) * innerH;
        const yLower = innerH - (lower / yMax) * innerH;
        const xMid = x + barW / 2;

        const bar = ns("path", {
          class: "bar",
          d: topRoundedRect(x, y, barW, Math.max(h, 0), 6),
          fill,
        });
        gRoot.appendChild(bar);

        if (err > 0) {
          const cap = Math.max(10, barW * 0.35);
          gRoot.appendChild(ns("line", { class: "error-bar", x1: xMid, x2: xMid, y1: yUpper, y2: yLower }));
          gRoot.appendChild(ns("line", { class: "error-bar", x1: xMid - cap / 2, x2: xMid + cap / 2, y1: yUpper, y2: yUpper }));
          gRoot.appendChild(ns("line", { class: "error-bar", x1: xMid - cap / 2, x2: xMid + cap / 2, y1: yLower, y2: yLower }));
        }

        const valText = ns("text", {
          class: "value-label",
          x: xMid,
          y: Math.max(12, (err > 0 ? yUpper : y) - 8),
          "text-anchor": "middle",
        }, [valueFormat(rawValue, i)]);
        gRoot.appendChild(valText);

        const words = label.split(" ");
        const lines = words.length > 4 ? [words.slice(0, 3).join(" "), words.slice(3).join(" ")] : [label];
        lines.forEach((line, li) => {
          gRoot.appendChild(
            ns("text", {
              class: "tick-label",
              x: x + barW / 2,
              y: innerH + 18 + li * 14,
              "text-anchor": "middle",
            }, [line])
          );
        });
      });

      container.innerHTML = "";
      container.appendChild(svg);
    }

    function renderGroupedRecallPrecision(container, categories, recall, precision, colorPairs) {
      const W = 720;
      const H = 280;
      const margin = { top: 36, right: 24, bottom: 56, left: 64 };
      const innerW = W - margin.left - margin.right;
      const innerH = H - margin.top - margin.bottom;
      const yMax = 1;
      const n = categories.length;
      const groupW = innerW / n;
      const innerGap = groupW * 0.15;
      const pairW = groupW - innerGap;
      const barW = pairW / 2 - 4;

      const legend = document.createElement("div");
      legend.className = "rp-legend";
      legend.style.cssText = "display:flex; gap:32px; margin-bottom:12px; flex-wrap:wrap;";

      categories.forEach((label, i) => {
        const cp = colorPairs[i];
        const col = document.createElement("div");
        col.style.cssText = "display:flex; flex-direction:column; gap:4px; min-width:140px;";

        const title = document.createElement("span");
        title.style.cssText = "font-size:12px; font-weight:600; color:#111;";
        title.textContent = label;
        col.appendChild(title);

        [{ color: cp.recall, metric: "Recall" }, { color: cp.precision, metric: "Precision" }].forEach((item) => {
          const row = document.createElement("div");
          row.style.cssText = "display:flex; align-items:center; gap:6px;";
          const swatch = document.createElement("span");
          swatch.style.cssText = `display:inline-block; width:28px; height:8px; border-radius:2px; background:${item.color};`;
          const text = document.createElement("span");
          text.style.cssText = "font-size:11px; color:#5c5c5c;";
          text.textContent = item.metric;
          row.appendChild(swatch);
          row.appendChild(text);
          col.appendChild(row);
        });

        legend.appendChild(col);
      });

      const svg = ns("svg", {
        viewBox: `0 0 ${W} ${H}`,
        width: "100%",
        height: H,
        role: "img",
        "aria-label": "Recall and precision by run",
      });

      const gRoot = ns("g", { transform: `translate(${margin.left},${margin.top})` });
      svg.appendChild(gRoot);

      const yTicks = [0, 0.2, 0.4, 0.6, 0.8, 1];
      for (const t of yTicks) {
        const y = innerH - t * innerH;
        gRoot.appendChild(ns("line", { class: "grid", x1: 0, x2: innerW, y1: y, y2: y }));
        gRoot.appendChild(
          ns(
            "text",
            {
              class: "tick-label",
              x: -10,
              y: y + 4,
              "text-anchor": "end",
              "font-size": "11",
              fill: "#5c5c5c",
            },
            [Math.round(t * 100) + "%"]
          )
        );
      }
      gRoot.appendChild(ns("line", { class: "axis-x", x1: 0, x2: innerW, y1: innerH, y2: innerH }));

      gRoot.appendChild(
        ns("text", {
          class: "y-label",
          x: -innerH / 2,
          y: -50,
          transform: "rotate(-90)",
          "text-anchor": "middle",
        }, ["RATE"])
      );

      categories.forEach((label, i) => {
        const gx = i * groupW + innerGap / 2;
        const cp = colorPairs[i];
        const vals = [
          { v: isFiniteNumber(recall[i]) ? recall[i] : 0, fill: cp.recall, name: "Recall" },
          { v: isFiniteNumber(precision[i]) ? precision[i] : 0, fill: cp.precision, name: "Precision" },
        ];
        vals.forEach((item, j) => {
          const x = gx + j * (barW + 6);
          const h = item.v * innerH;
          const y = innerH - h;
          gRoot.appendChild(
            ns("path", {
              class: "bar",
              d: topRoundedRect(x, y, barW, Math.max(h, 0), 6),
              fill: item.fill,
            })
          );
          gRoot.appendChild(
            ns("text", {
              class: "value-label",
              x: x + barW / 2,
              y: y - 6,
              "text-anchor": "middle",
              "font-size": "11",
            }, [pct(item.v)])
          );
        });

        const short = label.length > 22 ? label.slice(0, 20) + "…" : label;
        gRoot.appendChild(
          ns("text", {
            class: "tick-label",
            x: gx + pairW / 2,
            y: innerH + 20,
            "text-anchor": "middle",
          }, [short])
        );
      });

      container.innerHTML = "";
      container.appendChild(legend);
      container.appendChild(svg);
    }

    function normalizeAggregateRows(rows) {
      return rows.map((r) => ({
        label: r.runConfigName,
        repetitions: r.repetitions || 1,
        score: r.score,
        scoreStdDev: r.scoreStdDev,
        durationMs: r.sessionDurationMs,
        recall: r.recall,
        precision: r.precision,
        totalTokens: r.totalTokens,
        totalCostUsd: r.totalCostUsd,
        isSnyk: r.runConfigType === "command",
        barMain: r.runConfigType === "command" ? COLORS.snyk : COLORS.model,
      }));
    }

    function normalizeLegacyRuns(rows) {
      return rows.map((r) => ({
        label: r.runConfigName,
        repetitions: 1,
        score: r.score,
        scoreStdDev: 0,
        durationMs: r.metrics && r.metrics.sessionDurationMs,
        recall: r.details && r.details.recall,
        precision: r.details && r.details.precision,
        totalTokens: r.metrics ? (r.metrics.totalLogicalInputTokens || 0) + (r.metrics.totalOutputTokens || 0) : null,
        totalCostUsd: r.metrics && r.metrics.totalCostUsd,
        isSnyk: r.runConfigType === "command",
        barMain: r.runConfigType === "command" ? COLORS.snyk : COLORS.model,
      }));
    }

    function groupByTask(rows) {
      const groups = {};
      for (const row of rows) {
        const key = row.taskId || "__headline__";
        if (!groups[key]) groups[key] = [];
        groups[key].push(row);
      }
      return groups;
    }

    function renderMetricSection(group, runs, config) {
      const section = document.createElement("section");
      section.className = "chart-section";
      section.innerHTML = `<h3>${config.heading}</h3><p class="chart-desc">${config.description}</p><div class="chart-wrap"></div>`;
      group.appendChild(section);

      renderBarChart(section.querySelector(".chart-wrap"), {
        title: config.title,
        yAxisLabel: config.yAxisLabel,
        categories: runs.map((r) => r.label),
        values: runs.map(config.value),
        valueFormat: config.valueFormat,
        yMax: config.yMax,
        yTicks: config.yTicks,
        yTickFormat: config.yTickFormat,
        barColors: runs.map((r) => r.barMain),
        errorValues: config.errorValue ? runs.map(config.errorValue) : [],
      });
    }

    function renderComparisonGroup(container, options) {
      const { title, subtitle, rows, headline } = options;
      const group = document.createElement("div");
      group.className = headline ? "headline-group" : "task-group";

      const titleEl = document.createElement("h2");
      titleEl.className = "task-title";
      titleEl.textContent = title;
      group.appendChild(titleEl);

      const subtitleEl = document.createElement("p");
      subtitleEl.className = "task-subtitle";
      subtitleEl.textContent = subtitle;
      group.appendChild(subtitleEl);

      const runs = normalizeAggregateRows(rows);

      renderMetricSection(group, runs, {
        heading: headline ? "Headline score" : "Composite score",
        description: headline
          ? "Macro-averaged benchmark score across all fixtures (higher is better). Error bars show sample standard deviation across repetition-level headline scores."
          : "Aggregated benchmark score for this task across repetitions (higher is better). Error bars show sample standard deviation across repeated runs.",
        title: "Score - " + title,
        yAxisLabel: "SCORE",
        value: (r) => r.score,
        errorValue: (r) => r.scoreStdDev,
        valueFormat: (value, i) => pctWithStdDev(value, runs[i].scoreStdDev, runs[i].repetitions),
        yMax: 1,
        yTicks: [0, 0.2, 0.4, 0.6, 0.8, 1],
        yTickFormat: (t) => Math.round(t * 100) + "%",
      });

      const maxDur = Math.max(...runs.map((r) => r.durationMs), 1);
      const yMaxMs = Math.ceil(maxDur / 5000) * 5000;
      renderMetricSection(group, runs, {
        heading: "Session duration",
        description: headline
          ? "Macro-averaged wall-clock time from start to completion."
          : "Mean wall-clock time across repetitions for this task.",
        title: "Duration - " + title,
        yAxisLabel: "DURATION",
        value: (r) => r.durationMs,
        valueFormat: fmtMs,
        yMax: yMaxMs,
        yTicks: yTicks(yMaxMs),
        yTickFormat: (t) => (t >= 1000 ? Math.round(t / 1000) + "s" : String(Math.round(t))),
      });

      const yMaxTokens = niceMax(runs.map((r) => r.totalTokens), 25000);
      renderMetricSection(group, runs, {
        heading: "Total tokens",
        description: headline
          ? "Macro-averaged total tokens per config. Command-based runs are zero-token by design."
          : "Mean total tokens across repetitions. Command-based runs are zero-token by design.",
        title: "Total tokens - " + title,
        yAxisLabel: "TOKENS",
        value: (r) => r.totalTokens,
        valueFormat: fmtTokens,
        yMax: yMaxTokens,
        yTicks: yTicks(yMaxTokens),
        yTickFormat: fmtTokens,
      });

      const costValues = runs.map((r) => r.totalCostUsd).filter(isFiniteNumber);
      if (costValues.length > 0) {
        const yMaxCost = Math.max(0.01, Math.ceil(Math.max(...costValues) * 100) / 100);
        renderMetricSection(group, runs, {
          heading: "Estimated cost",
          description: headline
            ? "Macro-averaged session cost in USD. Command-based runs report N/A."
            : "Mean session cost in USD across repetitions. Command-based runs report N/A.",
          title: "Cost - " + title,
          yAxisLabel: "COST",
          value: (r) => r.totalCostUsd,
          valueFormat: fmtCost,
          yMax: yMaxCost,
          yTicks: yTicks(yMaxCost),
          yTickFormat: fmtCost,
        });
      }

      const hasRecallPrecision = runs.some((r) => r.recall != null && r.precision != null);
      if (hasRecallPrecision) {
        const rpSection = document.createElement("section");
        rpSection.className = "chart-section";
        rpSection.innerHTML = `<h3>Recall and precision</h3><p class="chart-desc">Recall (known vulns found) and precision (share of findings that matched ground truth).</p><div class="chart-wrap"></div>`;
        group.appendChild(rpSection);

        const recallPrecisionColors = runs.map((r) =>
          r.isSnyk
            ? { recall: COLORS.snykRecall, precision: COLORS.snykPrecision }
            : { recall: COLORS.modelRecall, precision: COLORS.modelPrecision }
        );
        renderGroupedRecallPrecision(
          rpSection.querySelector(".chart-wrap"),
          runs.map((r) => r.label),
          runs.map((r) => r.recall || 0),
          runs.map((r) => r.precision || 0),
          recallPrecisionColors
        );
      }

      container.appendChild(group);
    }

    function init() {
      const rowCounts = BENCHMARK_ROWS.reduce((acc, row) => {
        const type = row._type || "run";
        acc[type] = (acc[type] || 0) + 1;
        return acc;
      }, {});
      document.getElementById("report-meta").textContent =
        "Rows embedded: " +
        Object.entries(rowCounts).map(([type, count]) => `${count} ${type}`).join(", ");

      const configAggregates = BENCHMARK_ROWS.filter((r) => r._type === "config-aggregate");
      const taskAggregates = BENCHMARK_ROWS.filter((r) => r._type === "task-aggregate");
      const root = document.getElementById("charts-root");

      if (configAggregates.length > 0) {
        const fixtureCounts = [...new Set(configAggregates.map((r) => r.fixtureCount).filter(isFiniteNumber))];
        renderComparisonGroup(root, {
          title: "Headline comparison",
          subtitle: fixtureCounts.length === 1
            ? `Macro-average across ${fixtureCounts[0]} fixtures`
            : "Macro-average across fixtures",
          rows: configAggregates,
          headline: true,
        });
      }

      const groups = groupByTask(taskAggregates);
      for (const [taskId, rows] of Object.entries(groups)) {
        const first = rows[0];
        renderComparisonGroup(root, {
          title: first.taskName || taskId,
          subtitle: `${taskId} - aggregated across ${Math.max(...rows.map((r) => r.repetitions || 1))} repetition(s)`,
          rows,
          headline: false,
        });
      }

      if (configAggregates.length === 0 && taskAggregates.length === 0) {
        const legacyRuns = BENCHMARK_ROWS.filter((r) => (r._type || "run") === "run");
        const legacyGroups = groupByTask(legacyRuns);
        for (const [taskId, rows] of Object.entries(legacyGroups)) {
          const first = rows[0];
          const aggregateLikeRows = normalizeLegacyRuns(rows).map((run, i) => ({
            _type: "task-aggregate",
            taskId,
            taskName: first.taskName,
            runConfigName: run.label,
            runConfigType: rows[i].runConfigType,
            score: run.score,
            recall: run.recall,
            precision: run.precision,
            sessionDurationMs: run.durationMs,
            totalTokens: run.totalTokens,
            totalCostUsd: run.totalCostUsd,
          }));
          renderComparisonGroup(root, {
            title: first.taskName || taskId,
            subtitle: `${taskId} - legacy raw run rows`,
            rows: aggregateLikeRows,
            headline: false,
          });
        }
      }
    }

    init();
  </script>
</body>
</html>
