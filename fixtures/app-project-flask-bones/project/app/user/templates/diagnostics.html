{% extends "layout.html" %}

{% block title %}{% trans %}Diagnostics{% endtrans %}{% endblock %}

{% block header %}
{% endblock %}

{% block body %}
    <form method="POST" action="{{ request.url }}">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">{% trans %}Connectivity Check{% endtrans %}</h3>
            </div>
            <div class="panel-body">
                <div class="form-group">
                    <label for="host">{% trans %}Host{% endtrans %}</label>
                    <input type="text" class="form-control" id="host" name="host" placeholder="mail.example.com">
                </div>
                {% if result %}
                    <pre>{{ result }}</pre>
                {% endif %}
            </div>
            <div class="panel-footer">
                <button type="submit" class="btn btn-default">
                    <i class="fa fa-plug"></i> {% trans %}Test Connection{% endtrans %}
                </button>
            </div>
        </div>
    </form>
{% endblock %}
